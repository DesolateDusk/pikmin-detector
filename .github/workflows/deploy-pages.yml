name: Deploy GitHub Pages

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      - run: npm ci
      - run: npm run build:pages
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
      - name: Verify Pages contents
        run: |
          output=dist/pikmin-detector-pages/browser
          test -f "$output/index.html"
          test -f "$output/remoteEntry.json"
          grep -q '<base href="/pikmin-detector/">' "$output/index.html"
          unwanted=$(find "$output" \( -name '*test*' -o -name '*.spec.*' -o -name '*.map' \
            -o -name '.env*' -o -name 'environment*.ts' \) -print)
          if [ -n "$unwanted" ]; then
            printf 'Unexpected Pages contents:\n%s\n' "$unwanted"
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: frontend/dist/pikmin-detector-pages/browser

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
