services:
  - type: web
    name: pikmin-detector-api
    runtime: docker
    plan: free
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: ./backend/PikminDetector.Api/Dockerfile
    dockerContext: ./backend
    buildFilter:
      paths:
        - backend/**
        - .github/workflows/ci.yml
        - .github/workflows/backend.yml
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
    # 應用設定由 Doppler Render integration 同步，不在 Blueprint 重複管理。
